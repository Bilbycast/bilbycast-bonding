[package]
name = "bonding-transport"
version = "0.7.0"
edition = "2024"
description = "Async bonding transport: path managers, scheduler wiring, stats"
license = "MPL-2.0"
publish = false

[features]
default = ["path-udp", "path-rist", "path-quic"]
path-udp = []
path-rist = ["dep:rist-transport"]
path-quic = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:rustls-pemfile"]
# No SRT leg: UDP/QUIC/RIST already span the carrier design space, and
# SRT's TSBPD/TLPKTDROP delivery model fights the bond's own cross-leg
# reassembly + ARQ. For SRT bonding to a 3rd party, use libsrt
# socket-group bonding on the edge's SRT I/O instead.

[dependencies]
bonding-protocol = { path = "../bonding-protocol" }
tokio = { version = "1.52", features = ["net", "rt-multi-thread", "time", "sync", "macros"] }
bytes = "1.11"
log = "0.4"
thiserror = "2.0"
anyhow = "1.0"
tokio-util = "0.7"
socket2 = "0.6"
# Lock-free hot-swap of a UDP path's socket on interface churn
# (USB-dongle re-plug / ifindex change / DHCP renumber). The send
# path loads the current snapshot with no Mutex/RwLock.
arc-swap = "1.9"

# Optional path transports
rist-transport = { path = "../../bilbycast-rist/rist-transport", optional = true }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rcgen = { version = "0.14", optional = true }
rustls-pemfile = { version = "2", optional = true }
# ChaCha20-Poly1305 AEAD for optional bonded-path encryption (applied
# only when a key is configured). Same AEAD the edge QUIC tunnel uses.
ring = "0.17"

# `if_nametoindex` for NIC pinning via IP_BOUND_IF on Apple / BSD /
# Fuchsia. Linux uses SO_BINDTODEVICE which socket2 exposes directly.
# libc is used for NIC pinning: SO_BINDTODEVICE fallback to IP_UNICAST_IF
# (Linux/Android) and IP_BOUND_IF by index (Apple/BSD/Fuchsia).
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "freebsd", target_os = "fuchsia"))'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
rand = "0.10"
tokio = { version = "1.52", features = ["net", "rt-multi-thread", "time", "sync", "macros", "test-util"] }
